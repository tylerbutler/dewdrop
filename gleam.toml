name = "dewdrop"
version = "0.2.0"
description = "Fluid Framework protocol codec for aquamarine channel clients"
licences = ["MIT"]
repository = { type = "github", user = "tylerbutler", repo = "dewdrop" }
gleam = ">= 1.18.0"
target = "erlang"

[dependencies]
gleam_stdlib = ">= 0.48.0 and < 2.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
windsock = { git = "https://github.com/tylerbutler/windsock", ref = "main" }
aquamarine = { git = "https://github.com/tylerbutler/aquamarine", ref = "b81ada51412f6a0337c91460bc47c494d93ba3fb" }
beryl = { git = "https://github.com/tylerbutler/beryl", ref = "beryl-v0.6.0", path = "packages/beryl" }

[dev-dependencies]
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleeunit = ">= 1.0.0 and < 2.0.0"

[tools.trellis]
members = ["."]

[tools.trellis.publish]
exact_tag_format = "v{version}"
package_tags = ["exact"]
repository_tag_package = "dewdrop"
repository_tag_format = "v{series}"
repository_tags = ["major", "minor"]

[tools.trellis.publish.lifecycle]
default = "git_only"

[tools.trellis.release]
resume = true
auto_pre = true
skip_unchanged = true

[tools.trellis.changelog]
header_format = "# Changelog"
# Native checks include documentation and development files in this root package.
strictness = "warn"
