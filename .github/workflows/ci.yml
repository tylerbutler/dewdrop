name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test-erlang:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - otp-version: "27"
            erlang-version: "27.3.4.13"
          - otp-version: "28"
            erlang-version: "28.5.0.2"
    name: Test Erlang (OTP ${{ matrix.otp-version }})
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # ratchet:actions/checkout@v6

      - name: Setup toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # ratchet:jdx/mise-action@v4
        with:
          install_args: "erlang gleam rebar just"
          cache_key: "mise-{{platform}}-otp${{ matrix.erlang-version }}-{{file_hash}}"
          github_token: ${{ github.token }}
        env:
          MISE_ERLANG_VERSION: ${{ matrix.erlang-version }}

      - name: Cache Gleam package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6
        with:
          path: ~/.cache/gleam
          key: gleam-global-${{ runner.os }}-${{ hashFiles('gleam.toml', 'manifest.toml') }}
          restore-keys: |
            gleam-global-${{ runner.os }}-

      - name: Download dependencies
        run: just deps

      - name: Check formatting
        run: just format-check

      - name: Type check
        run: just check

      - name: Build (warnings as errors)
        run: just build-strict

      - name: Run tests
        run: just test

  docs:
    runs-on: ubuntu-latest
    name: Docs
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # ratchet:actions/checkout@v6

      - name: Setup toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # ratchet:jdx/mise-action@v4
        with:
          install_args: "erlang gleam rebar just"
          github_token: ${{ github.token }}

      - name: Cache Gleam package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6
        with:
          path: ~/.cache/gleam
          key: gleam-global-${{ runner.os }}-${{ hashFiles('gleam.toml', 'manifest.toml') }}
          restore-keys: |
            gleam-global-${{ runner.os }}-

      - name: Download dependencies
        run: just deps

      - name: Build documentation
        run: just docs
